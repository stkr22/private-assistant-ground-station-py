[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[project]
name = "app"
version = "0.6.0"
description = "Ground Station is an open-source endpoint that receives audio from satellites and handles STT/TTS processing for smart assistant systems."
authors = [{ name = "stkr22", email = "stkr22@github.com" }]
readme = "README.md"
license = "GPL-3.0-only"
license-files = [
    "LICENSE",
]

keywords = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Home Automation",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx~=0.28.1",
    "pydantic",
    "private-assistant-commons~=6.2.0",
    "fastapi[standard]~=0.128.0",
    "aiomqtt",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/stkr22/private-assistant-ground-station-py"
Repository = "https://github.com/stkr22/private-assistant-ground-station-py"
Documentation = "https://github.com/stkr22/private-assistant-ground-station-py/tree/main/docs"
Issues = "https://github.com/stkr22/private-assistant-ground-station-py/issues"
Changelog = "https://github.com/stkr22/private-assistant-ground-station-py/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff~=0.14.14",
    "mypy~=1.19.1",
    "pytest~=9.0.2",
    "pytest-cov~=7.0.0",
    "pytest-asyncio~=1.3.0",
    "websockets~=16.0",
    "types-pyyaml~=6.0.12.20250915",
]
